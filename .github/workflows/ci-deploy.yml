name: CI and deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: PHP syntax check (app/)
        run: |
          set -e
          find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Flat content CI checks
        run: php scripts/ci-check.php

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Pull on production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            # Local/untracked files (e.g. built assets) must not block pull.
            git stash push -u -m "ci-pre-deploy" || true
            git pull --ff-only origin main
            git stash pop || true
            echo "Deployed $(git rev-parse --short HEAD)"
