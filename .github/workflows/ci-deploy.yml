name: CI and deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: PHP syntax check (app/)
        run: |
          set -e
          find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Flat content CI checks
        run: php scripts/ci-check.php

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Pull on production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            # Production must match origin exactly. Stash-pop was restoring an old
            # local/untracked bundle.css over the freshly pulled file.
            git reset --hard origin/main
            git clean -fd -- public/css/parts_main/bundle.css public/js/parts_main/bundle.js || true
            # Drop leftover deploy stashes (if any) so they never reappear.
            git stash clear || true

            # Prefer site PHP binaries (ISPManager).
            PHP_BIN=php
            if [ -x /opt/php74/bin/php ]; then PHP_BIN=/opt/php74/bin/php
            elif [ -x /opt/php71/bin/php ]; then PHP_BIN=/opt/php71/bin/php
            fi

            # Flat content is read from SQLite index — rebuild after every content pull.
            rm -f bootstrap/cache/config.php
            $PHP_BIN artisan view:clear || true
            if grep -qE '^FLAT_CONTENT=true' .env 2>/dev/null; then
              $PHP_BIN artisan flat:build-index
            fi

            $PHP_BIN scripts/deploy-verify.php

            # Smoke test the origin itself, bypassing the CDN. --resolve keeps both
            # SNI and Host set to the domain so nginx picks the right vhost.
            # One canary per template: a fatal in a shared view took a domain down
            # for an hour before, and only a page fetch catches that.
            SERVER_IP=$(hostname -I | awk '{print $1}')
            SMOKE_FAILED=0
            for canary in infraredsaunafans.com infraredsaunaaccessories.com; do
              rm -f /tmp/origin-home.html
              curl -sk -m 25 --resolve "$canary:443:$SERVER_IP" "https://$canary/" -o /tmp/origin-home.html || true
              status=$(curl -sk -m 25 -o /dev/null -w '%{http_code}' --resolve "$canary:443:$SERVER_IP" "https://$canary/" || echo 000)
              echo "smoke $canary: status $status"
              echo "smoke $canary: title $(grep -o '<title>[^<]*</title>' /tmp/origin-home.html | head -1)"
              echo "smoke $canary: placeholder markers $(grep -c 'PLUG' /tmp/origin-home.html || true)"
              if [ "$status" != "200" ]; then
                SMOKE_FAILED=1
                echo "smoke $canary: FAILED"
                tail -n 60 storage/logs/laravel-$(date +%Y-%m-%d).log 2>/dev/null \
                  | grep -aoE "(local|production)\.(ERROR|CRITICAL): [^{]{0,220}" | tail -n 3 || true
              fi
            done

            echo "Deployed $(git rev-parse --short HEAD)"
            wc -c public/css/parts_main/bundle.css
            test -f public/css/parts_main/bundle.css
            grep -q "brand-page-intro" public/css/parts_main/bundle.css
            grep -q "bootstrap" public/css/parts_main/bundle.css
            grep -q "keep your cabin heating" content/brands/active-forever/text_blocks/9190.json
            test "$SMOKE_FAILED" = "0"
